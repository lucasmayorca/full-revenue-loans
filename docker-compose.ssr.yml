version: "3.9"

# SSR prototype + backend — desarrollo local
#
# Uso:
#   docker-compose -f docker-compose.ssr.yml up --build
#
# SSR: http://localhost:4000/offers
# Backend (API interna): http://localhost:3001  (no necesario abrir el browser)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      DEMO_MODE: "true"
      FRONTEND_URL: "http://localhost:4000"
      BACKEND_URL: "http://localhost:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ssr:
    build:
      context: ./ssr-prototype
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      BACKEND_URL: "http://backend:3001"
    depends_on:
      backend:
        condition: service_healthy
